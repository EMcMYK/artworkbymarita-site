# Brings Mom's Etsy shop onto the website (see scripts/etsy-sync.mjs). It only reads Etsy.
# Runs every morning, and any time you press "Run workflow"
# (github.com/EMcMYK/artworkbymarita-site → Actions → Sync from Etsy → Run workflow).
name: Sync from Etsy

on:
  schedule:
    - cron: "37 10 * * *"   # every day around 6:37am Eastern
  workflow_dispatch:
    inputs:
      resort:
        description: "Re-sort: apply today's rules in data/etsy-sync.json to pieces already on the site"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # the first run downloads every photo in the shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the sync still works (tests with a pretend Etsy)
        run: node --test scripts/*.test.mjs
      - name: Sync listings and photos
        run: node scripts/etsy-sync.mjs
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}   # Marita's Etsy sign-in (optional; README → Etsy sign-in)
          ETSY_TOKEN_OUT: ${{ runner.temp }}/etsy-refresh-token    # where the sync leaves the renewed sign-in
          SYNC_RESORT: ${{ inputs.resort }}
      - name: Save changes (Cloudflare republishes the site a minute later)
        run: |
          git config user.name "Etsy sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data images
          if git diff --cached --quiet; then
            echo "Nothing changed on Etsy."
          else
            git commit -m "Sync from Etsy"
            git pull --rebase origin main
            git push
          fi
      # Etsy gives a new sign-in token each morning; save it so tomorrow's run can use it.
      # Runs even if an earlier step failed, so a renewed sign-in is never lost.
      - name: Keep the Etsy sign-in fresh
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          f="$RUNNER_TEMP/etsy-refresh-token"
          if [ ! -s "$f" ]; then echo "No Etsy sign-in to save."; exit 0; fi
          if [ -z "$GH_TOKEN" ]; then echo "::error title=Etsy sign-in not saved::Add the GH_SECRETS_TOKEN secret (README → Etsy sign-in), or the sign-in stops working."; rm -f "$f"; exit 1; fi
          gh secret set ETSY_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$f"
          rm -f "$f"
          echo "Saved the renewed Etsy sign-in."
